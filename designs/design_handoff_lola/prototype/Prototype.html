<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lola — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#0e0f12;overflow:hidden;}
  #root{height:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @keyframes lolaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes lolaBreath{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(1.12);opacity:1}}
  @keyframes lolaPulse{0%{box-shadow:0 0 0 0 rgba(90,162,245,.5)}100%{box-shadow:0 0 0 34px rgba(90,162,245,0)}}
  @keyframes lolaSpin{to{transform:rotate(360deg)}}
  @keyframes lolaFlash{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
  @keyframes lolaSheetUp{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  @keyframes lolaGlow{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .lwave{display:flex;align-items:center;gap:7px;height:64px;}
  .lwave span{display:block;width:7px;border-radius:4px;height:18px;animation:lolaWave 1s ease-in-out infinite;}
  @keyframes lolaWave{0%,100%{height:16px}50%{height:58px}}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="dad.jsx"></script>
  <script type="text/babel" src="caregiver.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
